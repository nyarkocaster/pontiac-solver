[package]
name = "pontiac-cli"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Headless command-line interface for Pontiac Solver"

[[bin]]
name = "pontiac"
path = "src/main.rs"

[dependencies]
postflop-solver = { path = "../engine" }
multiway = { path = "../multiway" }
pushfold = { path = "../pushfold" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# pins the derive macros to the version the engine was written for
bincode_derive = "=2.0.0-rc.3"

[profile.release]
opt-level = 3
debug = false
