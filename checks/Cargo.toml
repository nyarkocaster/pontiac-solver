[package]
name = "checks"
version = "0.1.0"
edition = "2021"
[dependencies]
tiny_http = "0.12"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rayon = "1"
postflop-solver = { path = "../engine" }
multiway = { path = "../multiway" }
[profile.release]
debug = false

[[bin]]
name="study_test"
path="src/study_test.rs"
[[bin]]
name="checks"
path="src/main.rs"
[[bin]]
name="devserver"
path="src/devserver.rs"
[[bin]]
name="battery"
path="src/battery.rs"
[[bin]]
name="focus"
path="src/focus.rs"
