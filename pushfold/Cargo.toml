[package]
name = "pushfold"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Heads-up push/fold equilibrium calculator (part of Pontiac Solver)"

[dependencies]
serde = { version = "1", features = ["derive"] }
rayon = "1.8"

# only the table generator needs these
multiway = { path = "../multiway", optional = true }

[features]
generate = ["dep:multiway"]

[[bin]]
name = "gen_exact"
path = "src/bin/gen_exact.rs"
required-features = ["generate"]

[[bin]]
name = "check_exact"
path = "src/bin/check_exact.rs"
required-features = ["generate"]

[profile.release]
opt-level = 3
